[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moleditpy-3d-functional-group-replacer"
version = "0.8.3"
description = "3D Functional Group replacement plugin for MoleditPy"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9,<3.15"
dependencies = [
    "rdkit",
    "PyQt6",
    "numpy",
]

[tool.setuptools.packages.find]
include = ["functional_group_replacer_3d*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
