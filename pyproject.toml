[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moleditpy-3d-functional-group-toolbox"
version = "0.1.0"
description = "Functional group replacement plugin for MoleditPy"
requires-python = ">=3.9,<3.15"
dependencies = ["rdkit", "PyQt6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
