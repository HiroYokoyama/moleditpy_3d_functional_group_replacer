name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build source ZIP
        run: |
          TAG="${GITHUB_REF_NAME}"
          zip -r "moleditpy_3d_functional_group_toolbox_${TAG}.zip" \
            functional_group_toolbox_3d functional_group_toolbox_3d.py tests README.md LICENSE pyproject.toml \
            AGENTS.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md \
            --exclude "*/__pycache__/*" "*/.pytest_cache/*"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ASSET="moleditpy_3d_functional_group_toolbox_${TAG}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" --generate-notes "$ASSET"
          fi
